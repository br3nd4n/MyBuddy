[package]
name = "wasm_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlCanvasElement", "HtmlElement",
  "CanvasRenderingContext2d", "WebGlRenderingContext", "console", "Element", "Node"
]}
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
wasm-logger = "0.2"