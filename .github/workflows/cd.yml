name: CD — Build & Push Docker, Optional SSH Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/realtime-server

jobs:
  build-and-push:
    name: Build Docker image and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain & wasm-pack
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: wasm-client
        run: wasm-pack build --release --target web --out-dir ./static/pkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Publish .NET
        working-directory: server
        run: dotnet publish -c Release -o ./publish

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            DOTNET_RUNTIME=7.0

      - name: Create release metadata (short)
        run: echo "IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}" > release-info.txt

      - name: Upload release-info
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info.txt

  deploy-ssh:
    name: Deploy to remote host (optional)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release-info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: .

      - name: Deploy via SSH (pull & restart)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
            echo "Pulling image $IMAGE"
            docker pull $IMAGE
            # If you use a stack/docker-compose on remote host, adjust commands below:
            if [ -f docker-compose.yml ]; then
              docker-compose pull
              docker-compose up -d
            else
              # Stop previous container (if exists) and run new one
              docker rm -f realtime_server || true
              docker run -d --name realtime_server -p 5000:5000 --restart unless-stopped $IMAGE
            fi