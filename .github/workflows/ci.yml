name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM (wasm-pack)
        working-directory: wasm-client
        run: wasm-pack build --release --target web --out-dir ./static/pkg

  build-dotnet:
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'
      - name: Build server
        run: dotnet build server/RealTimeServer.csproj --configuration Release
      - name: Run tests (none in scaffold)
        run: echo "Add tests to run them here"